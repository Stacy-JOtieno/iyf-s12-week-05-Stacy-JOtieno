
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Remover</title>
    <style>
      img {
  width: 300px;
  height: 200px;
  object-fit: cover; /* Crops the image to fill the box without distorting */
  object-position: center; /* Focuses on the center of the image */
}

    </style>
</head>
<body>

    <h1>My Image Gallery</h1>

    <img src="C:\Users\Stacy\Desktop\Maverick\Wecanacademy\iyf-s12-week-05-Stacy-JOtieno\6.jpg" alt="Friends in a graduation">
    <img src="C:\Users\Stacy\Desktop\Maverick\Wecanacademy\iyf-s12-week-05-Stacy-JOtieno\8.jpg" alt="Graduation">
    <img src="C:\Users\Stacy\Desktop\Maverick\Wecanacademy\iyf-s12-week-05-Stacy-JOtieno\10.jpg" alt="Sisters Graduating">

    <br><br>

    <button id="removeButton">Remove Images</button>

    <script>
        const button = document.getElementById("removeButton");

        button.addEventListener("click", function() {

            const images = document.querySelectorAll("img");

            images.forEach(function(image) {
                image.remove();
            });

        });
    </script>

</body>
</html>
