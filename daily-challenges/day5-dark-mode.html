
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dark Mode Toggle</title>

    <style>
        body {
            background-color: white;
            color: black;
            transition: background-color 0.5s, color 0.5s;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        body.dark-mode {
            background-color: #121212;
            color: white;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>Click the button to change the theme.</p>

    <button id="themeButton">Enable Dark Mode</button>

    <script>
        const button = document.getElementById("themeButton");

        // Check previously saved preference
        let darkMode = localStorage.getItem("theme") === "dark";

        // Apply saved preference
        document.body.classList.toggle("dark-mode", darkMode);

        button.textContent = darkMode ? "Enable Light Mode" : "Enable Dark Mode";

        button.addEventListener("click", function() {

            // Toggle dark mode
            document.body.classList.toggle("dark-mode");

            // Check whether dark mode is active
            darkMode = document.body.classList.contains("dark-mode");

            // Save preference
            localStorage.setItem("theme", darkMode ? "dark" : "light");

            // Update button text
            button.textContent = darkMode ? "Enable Light Mode" : "Enable Dark Mode";

        });
    </script>

</body>
</html>
